<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>夜店の型抜き</title>
<style>
  :root {
    --night: #1a1b33;
    --candy: #f6dcc3;
    --candy-line: #b58a68;
    --lantern: #ffd98a;
    --ink: #f3efe6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--night);
    color: var(--ink);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px; pointer-events: none;
  }
  .score { font-size: 40px; font-weight: 700; line-height: 1; }
  .score small { font-size: 14px; font-weight: 400; opacity: .75; margin-left: 4px; }
  .right { text-align: right; }
  .best { font-size: 13px; opacity: .75; margin-bottom: 6px; }
  .plates { font-size: 22px; letter-spacing: 4px; }

  .melt-gauge {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: min(260px, 60vw); pointer-events: none;
  }
  .melt-gauge .label { font-size: 12px; opacity: .8; margin-bottom: 4px; text-align: center; }
  .melt-gauge .bar {
    height: 10px; border-radius: 999px; background: rgba(255,255,255,.15); overflow: hidden;
  }
  .melt-gauge .fill {
    height: 100%; width: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #e0526b, #ffd98a);
    transition: width .15s;
  }

  .overlay {
    position: fixed; inset: 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: safe center;
    gap: 14px; text-align: center; padding: 24px;
    background: rgba(18, 18, 40, .62);
    backdrop-filter: blur(3px);
    transition: opacity .3s;
    cursor: auto;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 { font-size: 38px; letter-spacing: .1em; font-weight: 700; }
  .rules { display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 14px; line-height: 1.7; max-width: 28em; }
  .rules div { background: rgba(255,255,255,.07); border-radius: 10px; padding: 9px 14px; }
  .rules b { color: var(--lantern); }
  .overlay .final { font-size: 62px; font-weight: 700; color: var(--lantern); line-height: 1; }
  .overlay .tag { font-size: 16px; opacity: .85; }
  .overlay p { font-size: 14px; line-height: 1.8; opacity: .9; }
  button {
    font: inherit; font-size: 17px; font-weight: 700;
    color: #33251a; background: var(--lantern);
    border: none; border-radius: 999px;
    padding: 13px 42px; margin-top: 6px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .hint { font-size: 13px; opacity: .6; }

  .pop {
    position: fixed; font-size: 19px; font-weight: 700; color: var(--lantern);
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    pointer-events: none; animation: rise .9s ease-out forwards;
    transform: translate(-50%, -50%);
  }
  .pop.rare { font-size: 26px; color: #ffe9b0; }
  .pop.bad { color: #ff9aa8; font-size: 16px; }
  @keyframes rise {
    0%   { opacity: 0; margin-top: 8px; }
    20%  { opacity: 1; margin-top: 0; }
    100% { opacity: 0; margin-top: -30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pop { animation: none; opacity: 1; }
    .overlay { transition: none; }
    .melt-gauge .fill { transition: none; }
  }
</style>
</head>
<body>
<a href="index.html" style="position:fixed;bottom:14px;left:14px;z-index:99999;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:100px;background:rgba(11,15,28,0.72);border:1px solid rgba(246,201,119,0.35);color:#f6c877;font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;font-size:12.5px;letter-spacing:0.04em;text-decoration:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,0.35);">← 遊戯場へ戻る</a>
<canvas id="game"></canvas>

<div class="hud">
  <div class="score"><span id="score">0</span><small>点</small></div>
  <div class="right">
    <div class="best">じこベスト <span id="best">0</span> 点</div>
    <div class="plates" id="plates">🍬🍬🍬</div>
  </div>
</div>

<div class="melt-gauge">
  <div class="label">あめの板(とけるまで)</div>
  <div class="bar"><div class="fill" id="meltFill"></div></div>
</div>

<div class="overlay" id="startOverlay">
  <h1>夜店の型抜き</h1>
  <div class="rank-side-layout">
    <div class="rank-side-left">
      <div class="rules">
        <div>🪡 飴の板に彫られた<b>線の上を、針でなぞる</b>。押しながら指やマウスを動かすと削れる。</div>
        <div>💥 線から<b>はみ出す</b>と板にひびが入る。ひびが広がりきると<b>割れて</b>おしまい。</div>
        <div>💨 <b>急いで動かす</b>とひびが入りやすい。針は、そっと、ゆっくり。</div>
        <div>🕯 でも手のぬくもりで飴は<b>とけていく</b>。とけきる前に、線をぜんぶなぞれ。</div>
        <div>🍬 板は3枚。型がむずかしくなるほど高得点。ひび無しで抜けば<b>ボーナス</b>。</div>
      </div>
      <button id="startBtn">はじめる</button>
      <div class="hint">マウス / 指 で針を動かす(途中で離してもOK)</div>
    </div>
    <div class="rank-side-right">
      <div id="startRankBox"></div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="tag">きろく</div>
  <div class="final"><span id="finalScore">0</span>点</div>
  <p id="endMsg"></p>
  <div id="rankBox"></div>
  <button id="retryBtn">もういちど</button>
</div>

<script src="ranking.js"></script>
<script>
(() => {
  const GAME_KEY = 'katanuki';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const platesEl = document.getElementById('plates');
  const meltFill = document.getElementById('meltFill');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const endMsgEl = document.getElementById('endMsg');

  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (shape) layoutPlate(true);
  }
  window.addEventListener('resize', resize);

  // ---- 型(正規化座標、yは上向き) ----
  function polar(fn, n = 120) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = i / n * Math.PI * 2;
      const r = fn(t);
      pts.push({ x: Math.cos(t) * r, y: Math.sin(t) * r });
    }
    return pts;
  }
  function star() {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const a = Math.PI / 2 + i * Math.PI / 5;
      const r = i % 2 ? 0.46 : 1;
      pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
    return pts;
  }
  function crescent() {
    const R1 = 1, cx2 = 0.42, R2 = 0.86, N = 240;
    const outer = [], inner = [];
    for (let i = 0; i < N; i++) {
      const t = i / N * Math.PI * 2;
      const x = Math.cos(t) * R1, y = Math.sin(t) * R1;
      if (Math.hypot(x - cx2, y) >= R2) outer.push({ x, y });
    }
    for (let i = 0; i < N; i++) {
      const t = i / N * Math.PI * 2;
      const x = cx2 + Math.cos(t) * R2, y = Math.sin(t) * R2;
      if (Math.hypot(x, y) <= R1) inner.push({ x, y });
    }
    const last = outer[outer.length - 1];
    const d0 = Math.hypot(inner[0].x - last.x, inner[0].y - last.y);
    const d1 = Math.hypot(inner[inner.length - 1].x - last.x, inner[inner.length - 1].y - last.y);
    if (d1 < d0) inner.reverse();
    return outer.concat(inner);
  }
  function fish() {
    const pts = [], cx = -0.15, a = 0.75, b = 0.45, N = 70;
    for (let i = 0; i <= N; i++) {
      const t = Math.PI - (Math.PI - 0.5) * i / N;
      pts.push({ x: cx + Math.cos(t) * a, y: Math.sin(t) * b });
    }
    pts.push({ x: 0.98, y: 0.5 }, { x: 0.82, y: 0 }, { x: 0.98, y: -0.5 });
    for (let i = 0; i < N; i++) {
      const t = -0.5 - (Math.PI - 0.5) * i / N;
      pts.push({ x: cx + Math.cos(t) * a, y: Math.sin(t) * b });
    }
    return pts;
  }
  function normalize(pts) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of pts) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const s = 1 / Math.max(maxX - minX, maxY - minY) * 2;
    return pts.map(p => ({ x: (p.x - cx) * s, y: (p.y - cy) * s }));
  }
  const SHAPES = [
    { name: '満月', gen: () => polar(() => 1) },
    { name: 'おにぎり', gen: () => polar(t => 0.82 - 0.18 * Math.sin(3 * t)) },
    { name: '星', gen: star },
    { name: '三日月', gen: crescent },
    { name: 'さくら', gen: () => polar(t => 0.72 + 0.28 * Math.cos(5 * t), 160) },
    { name: 'ひょうたん', gen: () => polar(t => 0.74 + 0.26 * Math.cos(2 * (t - Math.PI / 2)), 140) },
    { name: '金魚', gen: fish },
  ];

  function resample(pts, step) {
    const out = [{ x: pts[0].x, y: pts[0].y }];
    const closed = pts.concat([pts[0]]);
    let carry = 0;
    for (let i = 0; i < closed.length - 1; i++) {
      const a = closed[i], b = closed[i + 1];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      if (segLen === 0) continue;
      let d = step - carry;
      while (d <= segLen) {
        const t = d / segLen;
        out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
        d += step;
      }
      carry = segLen - (d - step);
    }
    return out;
  }
  function distToSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
  }

  // ---- 状態 ----
  let score, best, playing, plates, level;
  let shape = null, shapePts = null, path = [], cutCount = 0;
  let health, melt, meltMax, plateState = 'cutting', stateUntil = 0;
  let cracks = [], shards = [], plate = null, scale = 1, tolCut = 10, tolSafe = 16, fastThresh = 26;
  let lastFastPop = 0, crackAcc = 0;
  const pointer = { x: -100, y: -100, down: false };

  best = Ranking.getBest(GAME_KEY);
  bestEl.textContent = best;
  Ranking.mount('startRankBox', GAME_KEY, { unit: '点' });

  function layoutPlate(keepCuts) {
    const S = Math.min(Math.min(W, H) * 0.62, 440);
    plate = { x: W / 2 - S / 2, y: H / 2 - S / 2 + 10, w: S, h: S, cx: W / 2, cy: H / 2 + 10 };
    scale = S / 380;
    const R = S * 0.36;
    const screenPts = shapePts.map(p => ({ x: plate.cx + p.x * R, y: plate.cy - p.y * R }));
    const fresh = resample(screenPts, 5 * scale);
    if (keepCuts && path.length) {
      for (let i = 0; i < fresh.length; i++) fresh[i].cut = !!path[Math.floor(i / fresh.length * path.length)].cut;
    } else {
      for (const p of fresh) p.cut = false;
    }
    path = fresh;
    cutCount = path.filter(p => p.cut).length;
    const tight = Math.min(level - 1, 6);
    tolCut = (10.5 - tight * 0.6) * scale;
    tolSafe = tolCut + 6 * scale;
    fastThresh = 26 * scale;
  }

  function newPlate() {
    shape = SHAPES[(level - 1) % SHAPES.length];
    shapePts = normalize(shape.gen());
    layoutPlate(false);
    health = 100;
    meltMax = Math.max(22, 46 - (level - 1) * 3);
    melt = 100;
    cracks = [];
    crackAcc = 0;
    plateState = 'cutting';
  }

  function reset() {
    score = 0;
    plates = 3;
    level = 1;
    shards = [];
    scoreEl.textContent = '0';
    newPlate();
    updateHud();
  }

  function updateHud() {
    platesEl.textContent = '🍬'.repeat(Math.max(0, plates));
    meltFill.style.width = Math.max(0, melt) + '%';
  }

  function showPop(x, y, text, cls) {
    const el = document.createElement('div');
    el.className = 'pop' + (cls ? ' ' + cls : '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function addCrack(x, y) {
    if (cracks.length > 80) return;
    const a = Math.random() * Math.PI * 2;
    cracks.push({ x, y, a, len: (8 + Math.random() * 18) * scale, branch: Math.random() < 0.5 });
  }

  function spawnShards() {
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      shards.push({
        x: plate.cx + (Math.random() - 0.5) * plate.w * 0.8,
        y: plate.cy + (Math.random() - 0.5) * plate.h * 0.8,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
        size: (6 + Math.random() * 12) * scale, life: 1,
      });
    }
  }

  function losePlate(reason) {
    plateState = 'broken';
    stateUntil = performance.now() + 1100;
    plates--;
    updateHud();
    spawnShards();
    showPop(plate.cx, plate.cy - 40, reason, 'bad');
    if (plates <= 0) {
      playing = false;
      setTimeout(endGame, 1100);
    }
  }

  function completePlate() {
    plateState = 'done';
    stateUntil = performance.now() + 1000;
    const bonus = Math.round(health / 10);
    let pts = 10 + level * 4 + bonus;
    if (health >= 85) {
      pts += 5;
      showPop(plate.cx, plate.cy - 40, `みごと! ${shape.name} +${pts}`, 'rare');
    } else {
      showPop(plate.cx, plate.cy - 40, `${shape.name} +${pts}`);
    }
    score += pts;
    scoreEl.textContent = score;
    level++;
  }

  function cutStroke(ax, ay, bx, by) {
    const moveLen = Math.hypot(bx - ax, by - ay);
    if (moveLen === 0) return;
    let minD = Infinity;
    for (const p of path) {
      const d = distToSeg(p.x, p.y, ax, ay, bx, by);
      if (d < minD) minD = d;
      if (!p.cut && d <= tolCut) { p.cut = true; cutCount++; }
    }
    let dmg = 0;
    if (minD > tolSafe) {
      dmg += moveLen * 0.45;
      crackAcc += dmg;
      if (crackAcc > 5) { crackAcc = 0; addCrack(bx, by); }
    }
    if (moveLen > fastThresh) {
      dmg += (moveLen - fastThresh) * 0.25;
      addCrack(bx, by);
      const now = performance.now();
      if (now - lastFastPop > 700) { lastFastPop = now; showPop(bx, by - 30, '急ぎすぎ!', 'bad'); }
    }
    if (dmg > 0) {
      health -= dmg;
      if (health <= 0) { health = 0; losePlate('割れた…'); return; }
    }
    if (cutCount / path.length >= 0.97) completePlate();
  }

  // ---- 描画 ----
  const lanternsBg = [];
  for (let i = 0; i < 7; i++) lanternsBg.push({ fx: 0.08 + i * 0.14, fy: 0.12 + (i % 2) * 0.06, r: 26 + (i % 3) * 8 });

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#12132a');
    g.addColorStop(1, '#2a1f33');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (const l of lanternsBg) {
      const x = l.fx * W, y = l.fy * H;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, l.r * 2.4);
      rg.addColorStop(0, 'rgba(255,190,110,.35)');
      rg.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(x, y, l.r * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e8503f';
      ctx.beginPath(); ctx.ellipse(x, y, l.r * 0.55, l.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    }
    // 屋台の台
    ctx.fillStyle = 'rgba(70, 44, 28, .55)';
    roundRect(plate.x - 40 * scale, plate.y - 30 * scale, plate.w + 80 * scale, plate.h + 60 * scale, 14 * scale);
    ctx.fill();
  }

  function drawPlate() {
    if (plateState === 'broken') return;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.4)';
    ctx.shadowBlur = 14 * scale;
    ctx.shadowOffsetY = 4 * scale;
    ctx.fillStyle = '#f6dcc3';
    roundRect(plate.x, plate.y, plate.w, plate.h, 10 * scale);
    ctx.fill();
    ctx.restore();
    // ひび割れ具合で赤みを帯びる
    const hurt = 1 - health / 100;
    if (hurt > 0) {
      ctx.fillStyle = `rgba(190, 70, 70, ${hurt * 0.22})`;
      roundRect(plate.x, plate.y, plate.w, plate.h, 10 * scale);
      ctx.fill();
    }
    // 型の名前
    ctx.fillStyle = 'rgba(80, 52, 30, .75)';
    ctx.font = `${14 * scale + 2}px "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`だい ${level} 板 ・ ${shape.name}`, plate.cx, plate.y - 12 * scale);

    // 彫られた線
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = '#b58a68';
    ctx.lineWidth = 2.2 * scale;
    ctx.beginPath();
    for (let i = 0; i < path.length; i++) {
      if (i === 0) ctx.moveTo(path[i].x, path[i].y); else ctx.lineTo(path[i].x, path[i].y);
    }
    ctx.closePath();
    ctx.stroke();

    // 削れた部分
    ctx.save();
    ctx.strokeStyle = '#ffd98a';
    ctx.shadowColor = 'rgba(255,217,138,.9)';
    ctx.shadowBlur = 8 * scale;
    ctx.lineWidth = 4 * scale;
    ctx.beginPath();
    for (let i = 0; i < path.length; i++) {
      const a = path[i], b = path[(i + 1) % path.length];
      if (a.cut && b.cut) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
    }
    ctx.stroke();
    ctx.restore();

    // ひび
    ctx.strokeStyle = 'rgba(90, 40, 30, .8)';
    ctx.lineWidth = 1.2 * scale;
    ctx.beginPath();
    for (const c of cracks) {
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(c.x + Math.cos(c.a) * c.len, c.y + Math.sin(c.a) * c.len);
      if (c.branch) {
        const mx = c.x + Math.cos(c.a) * c.len * 0.5, my = c.y + Math.sin(c.a) * c.len * 0.5;
        ctx.moveTo(mx, my);
        ctx.lineTo(mx + Math.cos(c.a + 0.9) * c.len * 0.5, my + Math.sin(c.a + 0.9) * c.len * 0.5);
      }
    }
    ctx.stroke();

    if (plateState === 'done') {
      ctx.fillStyle = 'rgba(255,217,138,.18)';
      roundRect(plate.x, plate.y, plate.w, plate.h, 10 * scale);
      ctx.fill();
    }
  }

  function drawShards() {
    for (const s of shards) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = '#f6dcc3';
      ctx.beginPath();
      ctx.moveTo(-s.size / 2, -s.size / 3);
      ctx.lineTo(s.size / 2, -s.size / 2);
      ctx.lineTo(s.size / 3, s.size / 2);
      ctx.lineTo(-s.size / 2, s.size / 3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawNeedle() {
    if (!playing) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pointer.x + 6, pointer.y - 26);
    ctx.lineTo(pointer.x, pointer.y);
    ctx.stroke();
    ctx.fillStyle = pointer.down ? '#ffd98a' : 'rgba(255,255,255,.9)';
    if (pointer.down) { ctx.shadowColor = 'rgba(255,217,138,.9)'; ctx.shadowBlur = 10; }
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, pointer.down ? 3.5 : 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  let lastT = 0;
  function frame(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;

    if (playing && plateState === 'cutting') {
      melt -= dt / meltMax * 100;
      if (melt <= 0) { melt = 0; losePlate('とけてしまった…'); }
      updateHud();
    }
    if (plateState !== 'cutting' && t >= stateUntil && plates > 0 && playing) {
      newPlate();
      updateHud();
    }
    for (const s of shards) {
      s.x += s.vx; s.y += s.vy; s.vy += 0.25; s.rot += s.vr; s.life -= dt * 0.9;
    }
    shards = shards.filter(s => s.life > 0);

    drawBackground();
    drawPlate();
    drawShards();
    drawNeedle();
    requestAnimationFrame(frame);
  }

  function endGame() {
    finalScoreEl.textContent = score;
    const prevBest = best;
    const result = Ranking.record(GAME_KEY, score);
    best = result.best;
    bestEl.textContent = best;
    if (score > prevBest) {
      endMsgEl.textContent = 'じこベスト更新!飴細工の職人も脱帽だ。';
    } else if (score >= 120) {
      endMsgEl.textContent = '型抜き名人。屋台のおじさんが黙って景品を差し出した。';
    } else if (score >= 50) {
      endMsgEl.textContent = 'なかなかの腕前。次はひび一つない型抜きを。';
    } else {
      endMsgEl.textContent = '針はそっと、線の上を。それだけさ。';
    }
    Ranking.mount('rankBox', GAME_KEY, { unit: '点', highlightDate: result.entry.date });
    endOverlay.classList.remove('hidden');
  }

  function start() {
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    reset();
    playing = true;
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);

  canvas.addEventListener('pointerdown', e => {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.down = true;
  });
  canvas.addEventListener('pointermove', e => {
    const nx = e.clientX, ny = e.clientY;
    if (pointer.down && playing && plateState === 'cutting') cutStroke(pointer.x, pointer.y, nx, ny);
    pointer.x = nx; pointer.y = ny;
  });
  window.addEventListener('pointerup', () => { pointer.down = false; });
  canvas.addEventListener('pointercancel', () => { pointer.down = false; });
  canvas.addEventListener('pointerleave', () => { pointer.down = false; });

  resize();
  level = 1;
  newPlate();
  playing = false;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
