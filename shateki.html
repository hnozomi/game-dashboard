<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>夜店の射的</title>
<style>
  :root {
    --night: #16223d;
    --wood: #5c3f2a;
    --wood-dark: #46301f;
    --lantern: #ffd98a;
    --ink: #f3efe6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--night);
    color: var(--ink);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px; pointer-events: none;
  }
  .score { font-size: 40px; font-weight: 700; line-height: 1; }
  .score small { font-size: 14px; font-weight: 400; opacity: .75; margin-left: 4px; }
  .right { text-align: right; }
  .best { font-size: 13px; opacity: .75; margin-bottom: 6px; }
  .corks { font-size: 15px; letter-spacing: 2px; color: #e8b07a; }

  .steady {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 13px; opacity: 0; transition: opacity .25s;
    color: #ffb3a0; text-shadow: 0 2px 6px rgba(0,0,0,.5);
    pointer-events: none;
  }
  .steady.on { opacity: 1; }

  .overlay {
    position: fixed; inset: 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: safe center;
    gap: 14px; text-align: center; padding: 24px;
    background: rgba(15, 22, 42, .6);
    backdrop-filter: blur(3px);
    transition: opacity .3s;
    cursor: auto;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 { font-size: 38px; letter-spacing: .1em; font-weight: 700; }
  .rules { display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 14px; line-height: 1.7; max-width: 28em; }
  .rules div { background: rgba(255,255,255,.07); border-radius: 10px; padding: 9px 14px; }
  .rules b { color: var(--lantern); }
  .overlay .final { font-size: 62px; font-weight: 700; color: var(--lantern); line-height: 1; }
  .overlay .tag { font-size: 16px; opacity: .85; }
  .overlay p { font-size: 14px; line-height: 1.8; opacity: .9; }
  button {
    font: inherit; font-size: 17px; font-weight: 700;
    color: #33251a; background: var(--lantern);
    border: none; border-radius: 999px;
    padding: 13px 42px; margin-top: 6px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .hint { font-size: 13px; opacity: .6; }

  .hit-pop {
    position: fixed; font-size: 19px; font-weight: 700; color: var(--lantern);
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    pointer-events: none; animation: rise .9s ease-out forwards;
    transform: translate(-50%, -50%);
  }
  .hit-pop.rare { font-size: 26px; color: #ffe9b0; }
  .hit-pop.info { color: #9fb6c9; font-size: 14px; }
  @keyframes rise {
    0%   { opacity: 0; margin-top: 8px; }
    20%  { opacity: 1; margin-top: 0; }
    100% { opacity: 0; margin-top: -30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hit-pop { animation: none; opacity: 1; }
    .overlay, .steady { transition: none; }
  }
</style>
</head>
<body>
<a href="index.html" style="position:fixed;bottom:14px;left:14px;z-index:99999;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:100px;background:rgba(11,15,28,0.72);border:1px solid rgba(246,201,119,0.35);color:#f6c877;font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;font-size:12.5px;letter-spacing:0.04em;text-decoration:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,0.35);">← 遊戯場へ戻る</a>
<canvas id="game"></canvas>

<div class="hud">
  <div class="score"><span id="score">0</span><small>点</small></div>
  <div class="right">
    <div class="best">じこベスト <span id="best">0</span> 点</div>
    <div class="corks" id="corks"></div>
  </div>
</div>

<div class="steady" id="steadyMsg">連射すると狙いがブレる…落ち着いて</div>

<div class="overlay" id="startOverlay">
  <h1>夜店の射的</h1>
  <div class="rank-side-layout">
    <div class="rank-side-left">
      <div class="rules">
        <div>🔫 ねらって <b>タップ / クリック</b> でコルクを発射。弾は <b>12発</b>。</div>
        <div>🎯 景品は <b>上のほうに当てる</b>と倒れやすい。ど真ん中はビクともしないぞ。</div>
        <div>📦 大物は一発じゃ倒れない。ぐらつかせて、追い打ちで落とせ。</div>
        <div>💨 <b>連射すると狙いがブレる</b>。ひと呼吸おいて撃つのが名人。</div>
        <div>🔔 最上段を流れる金の鈴は15点。当てられるものなら…</div>
      </div>
      <button id="startBtn">はじめる</button>
      <div class="hint">マウス / 指 でねらいをつける</div>
    </div>
    <div class="rank-side-right">
      <div id="startRankBox"></div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="tag">きろく</div>
  <div class="final"><span id="finalScore">0</span>点</div>
  <p id="prizeList"></p>
  <p id="endMsg"></p>
  <div id="rankBox"></div>
  <button id="retryBtn">もういちど</button>
</div>

<script src="ranking.js"></script>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const corksEl = document.getElementById('corks');
  const steadyMsg = document.getElementById('steadyMsg');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const prizeListEl = document.getElementById('prizeList');
  const endMsgEl = document.getElementById('endMsg');

  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (typeof buildStage === 'function' && stagePrizes) layoutShelves();
  }
  window.addEventListener('resize', resize);

  const TOTAL_CORKS = 12;
  const CORK_SPEED = 26;

  const PRIZE_TYPES = {
    candy:  { w: 30, h: 38, pts: 2,  stability: 1.0, emoji: '🍬', name: 'あめ',     color: '#e88bb0' },
    daruma: { w: 44, h: 50, pts: 4,  stability: 2.2, emoji: '',   name: 'だるま',   color: '#d8433f' },
    box:    { w: 62, h: 70, pts: 8,  stability: 4.2, emoji: '🎁', name: 'おかし箱', color: '#7ba8d9' },
    bear:   { w: 56, h: 78, pts: 10, stability: 5.0, emoji: '🧸', name: 'くまさん', color: '#c99a63' },
    bell:   { w: 30, h: 34, pts: 15, stability: 1.2, emoji: '🔔', name: '金の鈴',   color: '#f0b944' },
  };

  const GAME_KEY = 'shateki';

  let stagePrizes = null, corks, popTimers, shelves;
  let aim, score, best, corksLeft, playing, lastShot, spread, wonPrizes;

  best = Ranking.getBest(GAME_KEY);
  bestEl.textContent = best;
  Ranking.mount('startRankBox', GAME_KEY, { unit: '点' });

  function layoutShelves() {
    shelves = [
      { y: H * 0.30, depth: 10 },  // 上段(鈴が流れる)
      { y: H * 0.47, depth: 12 },  // 中段
      { y: H * 0.66, depth: 14 },  // 下段(大物)
    ];
  }

  function makePrize(type, x, shelfIdx, moving) {
    const spec = PRIZE_TYPES[type];
    return {
      type, x, shelfIdx,
      w: spec.w, h: spec.h,
      knock: 0,                 // 蓄積ダメージ
      lean: 0,                  // 見た目の傾き
      wobble: 0,                // ぐらぐらアニメ
      falling: false, fallT: 0,
      moving: moving || 0,      // 横移動速度
      dir: 1,
      gone: false,
    };
  }

  function buildStage() {
    layoutShelves();
    stagePrizes = [];
    // 下段:大物
    const bottomXs = [W * 0.22, W * 0.5, W * 0.78];
    stagePrizes.push(makePrize('bear', bottomXs[0], 2));
    stagePrizes.push(makePrize('box',  bottomXs[1], 2));
    stagePrizes.push(makePrize('bear', bottomXs[2], 2));
    // 中段:だるま
    const midXs = [W * 0.16, W * 0.38, W * 0.62, W * 0.84];
    for (const x of midXs) stagePrizes.push(makePrize('daruma', x, 1));
    // 上段:あめ + 流れる鈴
    const topXs = [W * 0.25, W * 0.5, W * 0.75];
    for (const x of topXs) stagePrizes.push(makePrize('candy', x, 0));
    stagePrizes.push(makePrize('bell', W * 0.1, 0, 1.6));
  }

  function reset() {
    score = 0;
    corksLeft = TOTAL_CORKS;
    corks = [];
    wonPrizes = [];
    spread = 0;
    lastShot = -999;
    aim = { x: W / 2, y: H / 2 };
    buildStage();
    scoreEl.textContent = '0';
    updateHud();
  }

  function updateHud() {
    corksEl.textContent = '● '.repeat(corksLeft).trim() || 'ー';
  }

  function shoot() {
    if (!playing || corksLeft <= 0) return;
    const now = performance.now() / 1000;
    const sinceLast = now - lastShot;
    lastShot = now;

    // 連射でブレ増加、待つと収まる
    if (sinceLast < 0.8) spread = Math.min(60, spread + 28);
    steadyMsg.classList.toggle('on', spread > 25);

    const jx = (Math.random() - .5) * spread;
    const jy = (Math.random() - .5) * spread;
    corksLeft--;
    updateHud();

    corks.push({
      x: W / 2, y: H + 10,
      tx: aim.x + jx, ty: aim.y + jy,
      t: 0,
    });

    if (corksLeft <= 0) {
      setTimeout(() => { if (playing) { playing = false; endGame(); } }, 1200);
    }
  }

  function hitPrize(p, hitY) {
    const spec = PRIZE_TYPES[p.type];
    const shelfY = shelves[p.shelfIdx].y;
    const topY = shelfY - p.h;
    // 当たった高さ: 0 = てっぺん, 1 = 根元
    const rel = Math.min(1, Math.max(0, (hitY - topY) / p.h));
    // てっぺん付近ほど倒しやすい(テコの原理)
    const torque = 0.4 + (1 - rel) * 1.4;
    p.knock += torque;
    p.wobble = 1;

    if (p.knock >= spec.stability) {
      p.falling = true;
      p.fallT = 0;
      score += spec.pts;
      scoreEl.textContent = score;
      wonPrizes.push(p.type);
      const label = (spec.emoji ? spec.emoji + ' ' : '') + spec.name + ' +' + spec.pts;
      showPop(p.x, topY - 14, label, p.type === 'bell' ? 'rare' : '');
    } else {
      p.lean = Math.min(0.35, p.lean + torque * 0.09);
      if (rel > 0.65) showPop(p.x, hitY - 18, '根元じゃ倒れない…', 'info');
      else showPop(p.x, hitY - 18, 'ぐらっ…!', '');
    }
  }

  function showPop(x, y, text, cls) {
    const el = document.createElement('div');
    el.className = 'hit-pop' + (cls ? ' ' + cls : '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function endGame() {
    steadyMsg.classList.remove('on');
    finalScoreEl.textContent = score;
    if (wonPrizes.length) {
      const counts = {};
      for (const t of wonPrizes) counts[t] = (counts[t] || 0) + 1;
      prizeListEl.textContent = '戦利品: ' + Object.entries(counts)
        .map(([t, n]) => `${PRIZE_TYPES[t].emoji || PRIZE_TYPES[t].name}×${n}`)
        .join('  ');
    } else {
      prizeListEl.textContent = '戦利品: なし…';
    }
    const prevBest = best;
    const result = Ranking.record(GAME_KEY, score);
    best = result.best;
    bestEl.textContent = best;
    if (score > prevBest) {
      endMsgEl.textContent = 'じこベスト更新!屋台の景品が空っぽだ。';
    } else if (score >= 30) {
      endMsgEl.textContent = 'みごとな腕前。てっぺん狙いが板についてきた。';
    } else if (score >= 12) {
      endMsgEl.textContent = 'なかなかやる。次は大物のてっぺんを狙え。';
    } else {
      endMsgEl.textContent = 'コツは「上を、ゆっくり」。それだけさ。';
    }
    Ranking.mount('rankBox', GAME_KEY, { unit: '点', highlightDate: result.entry.date });
    endOverlay.classList.remove('hidden');
  }

  function start() {
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    reset();
    playing = true;
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);

  canvas.addEventListener('pointermove', e => { aim.x = e.clientX; aim.y = e.clientY; });
  canvas.addEventListener('pointerdown', e => {
    aim.x = e.clientX; aim.y = e.clientY;
    shoot();
  });

  // ---- 描画 ----
  const lanternGlows = Array.from({ length: 6 }, (_, i) => ({
    x: (i + 0.5) / 6, sway: Math.random() * Math.PI * 2
  }));

  let t = 0;
  function frame() {
    t += 1 / 60;
    ctx.clearRect(0, 0, W, H);

    // 夜空
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.2);
    sky.addColorStop(0, '#141f38');
    sky.addColorStop(1, '#1d2c4d');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H * 0.2);

    // 屋台のひさし(紅白幕)
    const awningY = H * 0.13;
    ctx.fillStyle = '#c9463f';
    ctx.fillRect(0, awningY, W, H * 0.07);
    ctx.fillStyle = '#f0e8d8';
    const stripeW = 46;
    for (let x = 0; x < W; x += stripeW * 2) {
      ctx.beginPath();
      ctx.moveTo(x, awningY);
      ctx.lineTo(x + stripeW, awningY);
      ctx.lineTo(x + stripeW, awningY + H * 0.07);
      ctx.arc(x + stripeW / 2, awningY + H * 0.07, stripeW / 2, 0, Math.PI);
      ctx.lineTo(x, awningY + H * 0.07);
      ctx.closePath();
      ctx.fill();
    }

    // 提灯
    for (const l of lanternGlows) {
      const lx = l.x * W + Math.sin(t * 1.4 + l.sway) * 4;
      const ly = H * 0.075;
      ctx.fillStyle = 'rgba(255, 190, 100, .16)';
      ctx.beginPath(); ctx.arc(lx, ly, 26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e8503f';
      ctx.beginPath(); ctx.ellipse(lx, ly, 10, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255, 220, 150, .8)';
      ctx.beginPath(); ctx.ellipse(lx, ly, 4.5, 7, 0, 0, Math.PI * 2); ctx.fill();
    }

    // 屋台の背板
    ctx.fillStyle = '#2a2033';
    ctx.fillRect(0, H * 0.2, W, H * 0.62);

    // 棚と景品
    for (let i = 0; i < shelves.length; i++) {
      const s = shelves[i];
      ctx.fillStyle = '#46301f';
      ctx.fillRect(0, s.y, W, s.depth);
      ctx.fillStyle = '#5c3f2a';
      ctx.fillRect(0, s.y, W, 4);
    }

    for (const p of stagePrizes) {
      if (p.gone) continue;
      updatePrize(p);
      drawPrize(p);
    }

    // カウンター(手前の台)
    ctx.fillStyle = '#3a2a1c';
    ctx.fillRect(0, H * 0.82, W, H);
    ctx.fillStyle = '#5c3f2a';
    ctx.fillRect(0, H * 0.82, W, 6);

    // コルク弾
    for (const c of corks) {
      c.t += 1 / 60;
      const dur = 0.22;
      const k = Math.min(1, c.t / dur);
      const ease = 1 - Math.pow(1 - k, 2);
      c.cx = W / 2 + (c.tx - W / 2) * ease;
      c.cy = (H + 10) + (c.ty - (H + 10)) * ease;
      ctx.fillStyle = '#d9b98a';
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, 7 * (1 - k * 0.4), 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#a8895e';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (k >= 1 && !c.done) {
        c.done = true;
        // 着弾判定
        for (const p of stagePrizes) {
          if (p.gone || p.falling) continue;
          const shelfY = shelves[p.shelfIdx].y;
          const topY = shelfY - p.h;
          if (c.tx > p.x - p.w / 2 - 5 && c.tx < p.x + p.w / 2 + 5 &&
              c.ty > topY - 5 && c.ty < shelfY) {
            hitPrize(p, c.ty);
            break;
          }
        }
      }
    }
    corks = corks.filter(c => !c.done || c.t < 0.3);

    // ブレの回復
    spread = Math.max(0, spread - 0.5);
    if (spread <= 25) steadyMsg.classList.remove('on');

    // 照準
    if (playing) drawCrosshair();

    // 銃(画面下中央)
    drawGun();

    requestAnimationFrame(frame);
  }

  function updatePrize(p) {
    if (p.falling) {
      p.fallT += 1 / 60;
      if (p.fallT > 1) p.gone = true;
      return;
    }
    p.wobble = Math.max(0, p.wobble - 0.03);
    if (p.moving) {
      p.x += p.moving * p.dir;
      if (p.x > W - 30) p.dir = -1;
      if (p.x < 30) p.dir = 1;
    }
  }

  function drawPrize(p) {
    const spec = PRIZE_TYPES[p.type];
    const shelfY = shelves[p.shelfIdx].y;
    ctx.save();
    ctx.translate(p.x, shelfY);

    if (p.falling) {
      // 後ろに倒れて落ちる
      const k = p.fallT;
      ctx.rotate(-k * 1.6);
      ctx.translate(0, k * k * 120);
      ctx.globalAlpha = Math.max(0, 1 - k * 1.1);
    } else {
      const wob = Math.sin(t * 18) * p.wobble * 0.12;
      ctx.rotate(p.lean * 0.4 + wob);
    }

    // 本体
    if (p.type === 'daruma') {
      ctx.fillStyle = spec.color;
      ctx.beginPath();
      ctx.ellipse(0, -p.h / 2, p.w / 2, p.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f5e8d5';
      ctx.beginPath();
      ctx.ellipse(0, -p.h / 2 + 4, p.w / 3.2, p.h / 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-6, -p.h / 2, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -p.h / 2, 2.6, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = spec.color;
      const r = p.type === 'bell' ? 10 : 6;
      roundRect(-p.w / 2, -p.h, p.w, p.h, r);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.2)';
      roundRect(-p.w / 2 + 3, -p.h + 3, p.w - 6, 8, 4);
      ctx.fill();
      if (spec.emoji) {
        ctx.font = `${Math.floor(p.w * 0.62)}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(spec.emoji, 0, -p.h / 2 + 2);
      }
    }

    // ぐらつき表示(蓄積ダメージ)
    if (!p.falling && p.knock > 0) {
      const spec2 = PRIZE_TYPES[p.type];
      const ratio = p.knock / spec2.stability;
      ctx.fillStyle = `rgba(255, 217, 138, ${0.5 + ratio * 0.4})`;
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('▲'.repeat(Math.ceil(ratio * 3)), 0, -p.h - 8);
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCrosshair() {
    const r = 16 + spread * 0.5;
    ctx.strokeStyle = spread > 25 ? 'rgba(255, 150, 130, .9)' : 'rgba(255, 217, 138, .9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(aim.x, aim.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(aim.x - r - 6, aim.y); ctx.lineTo(aim.x - r + 6, aim.y);
    ctx.moveTo(aim.x + r - 6, aim.y); ctx.lineTo(aim.x + r + 6, aim.y);
    ctx.moveTo(aim.x, aim.y - r - 6); ctx.lineTo(aim.x, aim.y - r + 6);
    ctx.moveTo(aim.x, aim.y + r - 6); ctx.lineTo(aim.x, aim.y + r + 6);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 217, 138, .9)';
    ctx.beginPath();
    ctx.arc(aim.x, aim.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGun() {
    const gx = W / 2, gy = H;
    const ang = Math.atan2(aim.y - gy, aim.x - gx);
    ctx.save();
    ctx.translate(gx, gy);
    ctx.rotate(ang + Math.PI / 2);
    ctx.fillStyle = '#8a5a34';
    roundRect(-9, -64, 18, 64, 6);
    ctx.fill();
    ctx.fillStyle = '#6b4426';
    roundRect(-11, -30, 22, 30, 6);
    ctx.fill();
    ctx.restore();
  }

  resize();
  reset();
  playing = false;
  frame();
})();
</script>
