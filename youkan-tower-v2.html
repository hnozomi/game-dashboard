<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ようかんタワー 〜月夜の風〜</title>
<style>
  :root {
    --night-top: #1b2340;
    --night-bottom: #3a3357;
    --lantern: #ffd98a;
    --ink: #f3efe6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(var(--night-top), var(--night-bottom));
    color: var(--ink);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #game { display: block; width: 100vw; height: 100vh; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 16px 20px; pointer-events: none;
  }
  .score { font-size: 44px; font-weight: 700; line-height: 1; }
  .score small { font-size: 15px; font-weight: 400; opacity: .75; margin-left: 4px; }
  .best { font-size: 14px; opacity: .75; }

  .wind-indicator {
    position: fixed; top: 84px; left: 50%; transform: translateX(-50%);
    font-size: 18px; font-weight: 700; color: #bfe3d0;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    pointer-events: none; opacity: 0; transition: opacity .3s;
  }
  .wind-indicator.on { opacity: 1; }

  .overlay {
    position: fixed; inset: 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: safe center;
    gap: 14px; text-align: center; padding: 24px;
    background: rgba(20, 24, 46, .55);
    backdrop-filter: blur(3px);
    transition: opacity .3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 { font-size: 38px; letter-spacing: .1em; font-weight: 700; }
  .overlay p { font-size: 14px; line-height: 1.9; opacity: .9; max-width: 27em; }
  .rules { display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 14px; line-height: 1.7; max-width: 27em; }
  .rules div { background: rgba(255,255,255,.07); border-radius: 10px; padding: 9px 14px; }
  .rules b { color: var(--lantern); }
  .overlay .final { font-size: 64px; font-weight: 700; color: var(--lantern); line-height: 1; }
  .overlay .tag { font-size: 16px; opacity: .85; }
  button {
    font: inherit; font-size: 17px; font-weight: 700;
    color: #33251a; background: var(--lantern);
    border: none; border-radius: 999px;
    padding: 13px 42px; margin-top: 6px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .hint { font-size: 13px; opacity: .6; }

  .perfect-pop {
    position: fixed; left: 50%; transform: translateX(-50%);
    font-size: 22px; font-weight: 700; color: var(--lantern);
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
    pointer-events: none; animation: pop .9s ease-out forwards;
  }
  .perfect-pop.moon { font-size: 30px; color: #fff3cf; }
  @keyframes pop {
    0%   { opacity: 0; translate: 0 10px; }
    20%  { opacity: 1; translate: 0 0; }
    100% { opacity: 0; translate: 0 -30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .perfect-pop { animation: none; opacity: 1; }
    .overlay { transition: none; }
  }
</style>
</head>
<body>
<a href="index.html" style="position:fixed;bottom:14px;left:14px;z-index:99999;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:100px;background:rgba(11,15,28,0.72);border:1px solid rgba(246,201,119,0.35);color:#f6c877;font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;font-size:12.5px;letter-spacing:0.04em;text-decoration:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,0.35);">← 遊戯場へ戻る</a>
<canvas id="game"></canvas>

<div class="hud">
  <div class="score"><span id="score">0</span><small>段</small></div>
  <div class="best">じこベスト <span id="best">0</span> 段</div>
</div>

<div class="wind-indicator" id="windIndicator"></div>

<div class="overlay" id="startOverlay">
  <h1>ようかんタワー<br><span style="font-size:20px; letter-spacing:.2em;">〜月夜の風〜</span></h1>
  <div class="rank-side-layout">
    <div class="rank-side-left">
      <div class="rules">
        <div>🍡 タップ / スペースキー で ようかんを落として積む。はみ出したぶんは切り落とし。</div>
        <div>🌬 ときどき <b>夜風</b> が吹く。ようかんが流されるので、風向きを読んで落とすべし。</div>
        <div>🍓 まれに <b>大福</b> が流れてくる。ふんわり潰れて、乗せるとタワーの幅が回復。</div>
        <div>🌕 <b>ぴったり3連続</b>で「月見ボーナス」。満月が輝き、幅がまるごと元通り!</div>
      </div>
      <button id="startBtn">はじめる</button>
      <div class="hint">タップ / クリック / スペースキー で落とす</div>
    </div>
    <div class="rank-side-right">
      <div id="startRankBox"></div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="tag">きろく</div>
  <div class="final"><span id="finalScore">0</span>段</div>
  <p id="endMsg"></p>
  <div id="rankBox"></div>
  <button id="retryBtn">もういちど</button>
</div>

<script src="ranking.js"></script>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const endMsgEl = document.getElementById('endMsg');
  const windIndicator = document.getElementById('windIndicator');

  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const BLOCK_H = 34;
  const BASE_W = () => Math.min(W * 0.6, 260);
  const PERFECT_TOLERANCE = 7;
  const WIND_START = 6;      // この段から風が吹き始める
  const DAIFUKU_CHANCE = 0.14;
  const DAIFUKU_START = 4;

  function layerColor(i) {
    const hues = [
      [350, 45, 72], [28, 55, 62], [95, 30, 55],
      [265, 30, 62], [10, 50, 55], [45, 60, 70], [200, 35, 62],
    ];
    const [h, s, l] = hues[i % hues.length];
    return `hsl(${h} ${s}% ${l}%)`;
  }
  function darker(c) {
    const m = c.match(/hsl\((\d+) (\d+)% (\d+)%\)/);
    return `hsl(${m[1]} ${m[2]}% ${Math.max(0, m[3] - 16)}%)`;
  }

  const GAME_KEY = 'youkan-tower';

  let stack, moving, falling, debris, petals, cameraY, targetCameraY;
  let score, best, playing, speed, dir;
  let wind, perfectCombo, moonGlow;

  best = Ranking.getBest(GAME_KEY);
  bestEl.textContent = best;
  Ranking.mount('startRankBox', GAME_KEY, { unit: '段' });

  function reset() {
    score = 0;
    speed = 2.4;
    dir = 1;
    cameraY = 0; targetCameraY = 0;
    debris = [];
    petals = [];
    falling = null;
    wind = 0;
    perfectCombo = 0;
    moonGlow = 0;
    const bw = BASE_W();
    stack = [{ x: (W - bw) / 2, w: bw, y: 0, color: layerColor(0), kind: 'normal' }];
    spawnMoving();
    scoreEl.textContent = '0';
    updateWindIndicator();
  }

  function spawnMoving() {
    const top = stack[stack.length - 1];
    const isDaifuku = score >= DAIFUKU_START && Math.random() < DAIFUKU_CHANCE;
    moving = {
      x: -top.w,
      w: isDaifuku ? Math.min(top.w + 20, BASE_W()) : top.w,
      y: stack.length * BLOCK_H,
      color: isDaifuku ? '#f6f1ea' : layerColor(stack.length),
      kind: isDaifuku ? 'daifuku' : 'normal',
      squish: 0,
    };
    dir = 1;

    // 風の抽選:段が進むほど吹きやすく、強くなる
    if (score >= WIND_START && Math.random() < 0.45) {
      const strength = (0.5 + Math.random() * 0.9) * (1 + score * 0.015);
      wind = (Math.random() < 0.5 ? -1 : 1) * strength;
    } else {
      wind = 0;
    }
    updateWindIndicator();
  }

  function updateWindIndicator() {
    if (wind !== 0 && playing) {
      const arrows = Math.abs(wind) > 1.1 ? 3 : Math.abs(wind) > 0.8 ? 2 : 1;
      const a = (wind > 0 ? '→' : '←').repeat(arrows);
      windIndicator.textContent = wind > 0 ? `風 ${a}` : `${a} 風`;
      windIndicator.classList.add('on');
    } else {
      windIndicator.classList.remove('on');
    }
  }

  function drop() {
    if (!playing || !moving) return;
    const top = stack[stack.length - 1];
    const left = Math.max(moving.x, top.x);
    const right = Math.min(moving.x + moving.w, top.x + top.w);
    const overlap = right - left;

    if (overlap <= 0) {
      falling = { ...moving, vy: 0 };
      moving = null;
      playing = false;
      updateWindIndicator();
      setTimeout(endGame, 700);
      return;
    }

    const offset = Math.abs(moving.x - top.x);
    let newX = left, newW = overlap;
    let squish = 0;

    if (offset <= PERFECT_TOLERANCE) {
      perfectCombo++;
      if (perfectCombo >= 3) {
        // 月見ボーナス:幅まるごと回復
        newW = BASE_W();
        newX = top.x + (top.w - newW) / 2;
        newX = Math.max(8, Math.min(newX, W - 8 - newW));
        moonGlow = 1;
        perfectCombo = 0;
        showPop('🌕 月見ボーナス!', true);
      } else {
        newX = top.x;
        newW = Math.min(top.w + 4, BASE_W());
        newX = top.x + (top.w - newW) / 2;
        showPop(perfectCombo >= 2 ? `ぴったり! ×${perfectCombo}` : 'ぴったり!');
      }
    } else {
      perfectCombo = 0;
      const cutX = moving.x < top.x ? moving.x : right;
      debris.push({
        x: cutX, w: moving.w - overlap, y: moving.y, color: moving.color,
        kind: moving.kind, vy: 0, vr: (Math.random() - .5) * .1, r: 0
      });
      if (moving.kind === 'daifuku') {
        // 大福はふんわり潰れて幅ボーナス
        const bonus = Math.min(newW + 26, BASE_W()) - newW;
        newW += bonus;
        newX = Math.max(8, Math.min(newX - bonus / 2, W - 8 - newW));
        squish = 1;
        showPop('🍓 ふんわり!');
      }
    }

    if (moving.kind === 'daifuku' && offset <= PERFECT_TOLERANCE) squish = 1;

    stack.push({ x: newX, w: newW, y: moving.y, color: moving.color, kind: moving.kind, squish });
    score++;
    scoreEl.textContent = score;
    speed = 2.4 + score * 0.12;
    targetCameraY = Math.max(0, (stack.length - 6) * BLOCK_H);
    spawnMoving();
  }

  function showPop(text, moon) {
    const el = document.createElement('div');
    el.className = 'perfect-pop' + (moon ? ' moon' : '');
    el.textContent = text;
    el.style.top = (H * 0.32) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function endGame() {
    finalScoreEl.textContent = score;
    const prevBest = best;
    const result = Ranking.record(GAME_KEY, score);
    best = result.best;
    bestEl.textContent = best;
    if (score > prevBest) {
      endMsgEl.textContent = 'じこベスト更新!月も見ている。';
    } else if (score >= 20) {
      endMsgEl.textContent = '風をも味方につける職人技。';
    } else if (score >= 10) {
      endMsgEl.textContent = 'いい積みっぷり。夜風に負けるな。';
    } else {
      endMsgEl.textContent = 'ようかんは待っている。もういちど。';
    }
    Ranking.mount('rankBox', GAME_KEY, { unit: '段', highlightDate: result.entry.date });
    endOverlay.classList.remove('hidden');
  }

  function start() {
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    reset();
    playing = true;
    updateWindIndicator();
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (playing) drop();
    }
  });
  canvas.addEventListener('pointerdown', () => { if (playing) drop(); });

  // ---- 描画 ----
  function drawBlock(b, yOnScreen) {
    const squish = b.squish || 0;
    const h = BLOCK_H - 2 + squish * 6;
    const wExtra = squish * 10;
    const x = b.x - wExtra / 2;
    const w = b.w + wExtra;
    const y = yOnScreen - squish * 4;

    if (b.kind === 'daifuku') {
      // 大福:白くて丸い
      ctx.fillStyle = b.color;
      roundRect(x, y, w, h, 14);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      roundRect(x + 4, y + 3, w - 8, 7, 6);
      ctx.fill();
      // いちごの点
      ctx.fillStyle = '#e0526b';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + h / 2, 5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, yOnScreen, b.w, BLOCK_H - 2);
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.fillRect(b.x, yOnScreen, b.w, 5);
      ctx.fillStyle = darker(b.color);
      ctx.fillRect(b.x, yOnScreen + BLOCK_H - 8, b.w, 6);
    }
    if (b.squish) b.squish = Math.max(0, b.squish - 0.06);
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const stars = Array.from({ length: 60 }, () => ({
    x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + .4, tw: Math.random() * Math.PI * 2
  }));

  function spawnPetal() {
    petals.push({
      x: wind > 0 ? -10 : W + 10,
      y: Math.random() * H * 0.75,
      vx: wind * (2.2 + Math.random() * 1.6),
      vy: 0.3 + Math.random() * 0.6,
      r: Math.random() * Math.PI * 2,
      vr: (Math.random() - .5) * .15,
      s: 3 + Math.random() * 3,
    });
  }

  let t = 0;
  function frame() {
    t += 1 / 60;
    ctx.clearRect(0, 0, W, H);

    // 星
    for (const st of stars) {
      const a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.2 + st.tw));
      ctx.fillStyle = `rgba(255, 240, 210, ${a})`;
      ctx.fillRect(st.x * W, st.y * H * 0.7, st.s, st.s);
    }

    // 月(月見ボーナスで輝く)
    if (moonGlow > 0) {
      ctx.beginPath();
      ctx.arc(W * 0.82, H * 0.16, 34 + moonGlow * 26, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 240, 200, ${moonGlow * 0.35})`;
      ctx.fill();
      moonGlow = Math.max(0, moonGlow - 0.012);
    }
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.16, 34, 0, Math.PI * 2);
    ctx.fillStyle = '#f7e8c3';
    ctx.fill();
    if (moonGlow <= 0) {
      ctx.beginPath();
      ctx.arc(W * 0.80, H * 0.15, 34, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(27,35,64,.35)';
      ctx.fill();
    }

    // 風の花びら
    if (wind !== 0 && playing && Math.random() < Math.min(0.35, Math.abs(wind) * 0.25)) spawnPetal();
    for (const p of petals) {
      p.x += p.vx;
      p.y += p.vy + Math.sin(t * 3 + p.r) * 0.4;
      p.r += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = 'rgba(240, 190, 205, .75)';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.s, p.s * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    petals = petals.filter(p => p.x > -30 && p.x < W + 30 && p.y < H + 30);

    cameraY += (targetCameraY - cameraY) * 0.08;
    const groundY = H - 60;
    const yOf = b => groundY - b.y - BLOCK_H + cameraY;

    // 地面(お盆)
    ctx.fillStyle = '#241d33';
    ctx.fillRect(0, groundY + cameraY, W, H);
    ctx.fillStyle = 'rgba(255,217,138,.25)';
    ctx.fillRect(0, groundY + cameraY, W, 3);

    for (const b of stack) drawBlock(b, yOf(b));

    // 動くブロック(風に流される)
    if (moving && playing) {
      moving.x += speed * dir + wind;
      if (moving.x + moving.w > W - 8) { moving.x = W - 8 - moving.w; dir = -1; }
      if (moving.x < 8) { moving.x = 8; dir = 1; }
      drawBlock(moving, yOf(moving));
    }

    // 落下ブロック(ミス時)
    if (falling) {
      falling.vy += 0.7;
      falling.y -= falling.vy;
      drawBlock(falling, yOf(falling));
      if (yOf(falling) > H + 100) falling = null;
    }

    // 破片
    for (const d of debris) {
      d.vy += 0.7;
      d.y -= d.vy;
      d.r += d.vr;
      ctx.save();
      ctx.translate(d.x + d.w / 2, yOf(d) + BLOCK_H / 2);
      ctx.rotate(d.r);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.w / 2, -BLOCK_H / 2, d.w, BLOCK_H - 2);
      ctx.restore();
    }
    debris = debris.filter(d => yOf(d) < H + 100);

    requestAnimationFrame(frame);
  }

  reset();
  playing = false;
  frame();
})();
</script>
</body>
</html>
